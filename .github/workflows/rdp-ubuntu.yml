name: Ubuntu

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-24.04   # Ubuntu 24.04 LTS
    timeout-minutes: 360

    steps:
      - name: Install desktop and xrdp
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xfce4 xfce4-terminal xfce4-goodies dbus-x11 \
            greybird-gtk-theme gnome-themes-extra \
            xrdp xorgxrdp curl ca-certificates wget gpg
          sudo adduser xrdp ssl-cert
          sudo systemctl enable --now xrdp

      - name: Create user Tasfiq
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if [ -z "$RDP_PASSWORD" ]; then
            echo "RDP_PASSWORD secret is missing"; exit 1
          fi
          sudo useradd -m -s /bin/bash -G sudo tasfiq
          echo "tasfiq:$RDP_PASSWORD" | sudo chpasswd
          echo "tasfiq ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/tasfiq
          sudo chmod 440 /etc/sudoers.d/tasfiq
          echo "xfce4-session" | sudo -u tasfiq tee /home/tasfiq/.xsession
          sudo mkdir -p /home/tasfiq/Desktop /home/tasfiq/.config/autostart
          # Stop the colour-profile auth popup in xrdp sessions
          sudo tee /etc/polkit-1/rules.d/45-allow-colord.rules >/dev/null <<'EOF'
          polkit.addRule(function(action, subject) {
            if (action.id.indexOf("org.freedesktop.color-manager.") == 0) {
              return polkit.Result.YES;
            }
          });
          EOF

      - name: Configure first-login tasks (dark mode and app installer)
        run: |
          # Dark mode, applied inside the user's session at login
          sudo tee /home/tasfiq/dark-mode.sh >/dev/null <<'EOF'
          #!/bin/bash
          sleep 5
          xfconf-query -c xsettings -p /Net/ThemeName --create -t string -s "Greybird-dark"
          xfconf-query -c xfwm4 -p /general/theme --create -t string -s "Greybird-dark"
          gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark' 2>/dev/null || true
          EOF

          # App installer, runs once after the first sign-in
          sudo tee /home/tasfiq/install-everything.sh >/dev/null <<'EOF'
          #!/bin/bash
          MARK="$HOME/.install-everything.done"
          LOG="$HOME/Desktop/Install-Everything.log"
          [ -f "$MARK" ] && exit 0
          touch "$MARK"
          export DEBIAN_FRONTEND=noninteractive
          {
            echo "== Install started: $(date) =="
            sudo apt-get update
            for pkg in git vlc htop btop neofetch build-essential python3-pip nodejs npm; do
              echo "--- apt: $pkg"
              sudo apt-get install -y "$pkg" || echo "FAILED: $pkg"
            done
            for snap in firefox; do
              echo "--- snap: $snap"
              sudo snap install "$snap" || echo "FAILED: $snap"
            done
            echo "--- snap: code (classic)"
            sudo snap install code --classic || echo "FAILED: code"
            echo "== Install finished: $(date) =="
          } >> "$LOG" 2>&1
          EOF

          sudo chmod +x /home/tasfiq/dark-mode.sh /home/tasfiq/install-everything.sh

          sudo tee /home/tasfiq/.config/autostart/dark-mode.desktop >/dev/null <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Dark Mode
          Exec=/home/tasfiq/dark-mode.sh
          EOF

          sudo tee /home/tasfiq/.config/autostart/install-everything.desktop >/dev/null <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Install Everything
          Exec=/home/tasfiq/install-everything.sh
          EOF

          sudo chown -R tasfiq:tasfiq /home/tasfiq

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [ -z "$TS_AUTHKEY" ]; then
            echo "TAILSCALE_AUTHKEY secret is missing"; exit 1
          fi
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="gh-rdp-ubuntu" --accept-dns=false
          echo "=============================================="
          echo "Tailscale IP: $(tailscale ip -4)"
          echo "Connect with Remote Desktop to that IP"
          echo "Username: tasfiq"
          echo "=============================================="

      - name: Keep session alive
        run: |
          echo "Tailscale IP: $(tailscale ip -4)"
          END=$((SECONDS + 21000))   # ~5h50m, under the 6h job limit
          while [ $SECONDS -lt $END ]; do
            sleep 60
          done