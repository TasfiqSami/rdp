
name: Ubuntu 24.04 LTS RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install and configure Ubuntu desktop
        shell: bash
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -Eeuo pipefail

          if [[ -z "${RDP_PASSWORD:-}" ]]; then
            echo "::error::Add the RDP_PASSWORD repository secret."
            exit 1
          fi

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies xfce4-terminal \
            xrdp xorgxrdp xserver-xorg-core \
            dbus-x11 x11-xserver-utils \
            ca-certificates curl gnupg git wget unzip

          if ! id Tasfiq >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash Tasfiq
          fi

          echo "Tasfiq:${RDP_PASSWORD}" | sudo chpasswd
          unset RDP_PASSWORD

          sudo usermod -aG sudo,ssl-cert Tasfiq
          echo 'Tasfiq ALL=(ALL) NOPASSWD:ALL' | \
            sudo tee /etc/sudoers.d/90-tasfiq-rdp >/dev/null
          sudo chmod 0440 /etc/sudoers.d/90-tasfiq-rdp
          sudo visudo -cf /etc/sudoers.d/90-tasfiq-rdp

          # Configure a clean XFCE session for XRDP.
          sudo -u Tasfiq mkdir -p \
            /home/Tasfiq/.config/autostart \
            /home/Tasfiq/.local/bin \
            /home/Tasfiq/Desktop

          printf '%s\n' \
            '#!/bin/sh' \
            'unset DBUS_SESSION_BUS_ADDRESS' \
            'unset XDG_RUNTIME_DIR' \
            'exec startxfce4' |
            sudo tee /home/Tasfiq/.xsession >/dev/null

          sudo chown Tasfiq:Tasfiq /home/Tasfiq/.xsession
          sudo chmod 0755 /home/Tasfiq/.xsession

          # Use Xorg for the XRDP session.
          sudo adduser xrdp ssl-cert || true
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          echo "XRDP service status:"
          sudo systemctl --no-pager --full status xrdp || true

      - name: Configure post-login setup
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo tee /home/Tasfiq/.local/bin/first-login-setup.sh >/dev/null <<'SETUP'
          #!/usr/bin/env bash
          set -u

          mkdir -p "$HOME/Desktop"
          exec > >(tee -a "$HOME/Desktop/Install-Everything.log") 2>&1

          echo "Desktop setup started: $(date -Is)"

          # Apply dark mode after the graphical session starts.
          sleep 10
          if command -v xfconf-query >/dev/null 2>&1; then
            xfconf-query -c xsettings -p /Net/ThemeName \
              --create -t string -s "Adwaita-dark" || true
          fi
          if command -v gsettings >/dev/null 2>&1; then
            gsettings set org.gnome.desktop.interface color-scheme \
              'prefer-dark' 2>/dev/null || true
          fi

          echo "Updating package lists..."
          sudo -n apt-get update || echo "WARNING: apt update failed"

          echo "Installing base tools..."
          sudo -n apt-get install -y \
            git curl wget gnupg ca-certificates || true

          echo "Installing Brave..."
          if ! command -v brave-browser >/dev/null 2>&1; then
            curl -fsSLo /tmp/brave-keyring.gpg \
              https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg || true

            if [[ -s /tmp/brave-keyring.gpg ]]; then
              sudo -n install -m 0644 /tmp/brave-keyring.gpg \
                /usr/share/keyrings/brave-browser-archive-keyring.gpg

              echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" |
                sudo -n tee /etc/apt/sources.list.d/brave-browser-release.list >/dev/null

              sudo -n apt-get update &&
                sudo -n apt-get install -y brave-browser ||
                echo "WARNING: Brave installation failed"
            fi
          fi

          echo "Installing VS Code..."
          if ! command -v code >/dev/null 2>&1; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc |
              gpg --dearmor > /tmp/ms-packages.gpg || true

            if [[ -s /tmp/ms-packages.gpg ]]; then
              sudo -n install -m 0644 /tmp/ms-packages.gpg \
                /usr/share/keyrings/packages.microsoft.gpg

              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" |
                sudo -n tee /etc/apt/sources.list.d/vscode.list >/dev/null

              sudo -n apt-get update &&
                sudo -n apt-get install -y code ||
                echo "WARNING: VS Code installation failed"
            fi
          fi

          echo "Installing GitHub CLI..."
          if ! command -v gh >/dev/null 2>&1; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg |
              sudo -n dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg status=none || true

            if [[ -s /usr/share/keyrings/githubcli-archive-keyring.gpg ]]; then
              sudo -n chmod 0644 /usr/share/keyrings/githubcli-archive-keyring.gpg

              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" |
                sudo -n tee /etc/apt/sources.list.d/github-cli.list >/dev/null

              sudo -n apt-get update &&
                sudo -n apt-get install -y gh ||
                echo "WARNING: GitHub CLI installation failed"
            fi
          fi

          echo "Installing Node.js LTS..."
          curl -fsSL https://deb.nodesource.com/setup_lts.x \
            -o /tmp/nodesource-setup.sh || true

          if [[ -s /tmp/nodesource-setup.sh ]]; then
            sudo -n bash /tmp/nodesource-setup.sh &&
              sudo -n apt-get install -y nodejs ||
              echo "WARNING: Node.js installation failed"
          fi

          echo "Installing Discord..."
          if curl -fL --retry 2 \
            "https://discord.com/api/download?platform=linux&format=deb" \
            -o /tmp/discord.deb; then
            sudo -n apt-get install -y /tmp/discord.deb ||
              echo "WARNING: Discord installation failed"
          else
            echo "WARNING: Discord download failed"
          fi

          echo "Installing developer CLIs..."
          if command -v npm >/dev/null 2>&1; then
            sudo -n npm install -g \
              @openai/codex \
              @anthropic-ai/claude-code \
              vercel \
              @github/copilot ||
              echo "WARNING: One or more CLI installs failed"
          fi

          echo "Antigravity and ChatGPT desktop require a compatible official Linux package."
          echo "Neat Download Manager's Windows installer cannot be used natively on Ubuntu."
          echo "Desktop setup finished: $(date -Is)"
          SETUP

          sudo chmod 0755 /home/Tasfiq/.local/bin/first-login-setup.sh
          sudo chown -R Tasfiq:Tasfiq /home/Tasfiq/.local

          sudo tee /home/Tasfiq/.config/autostart/first-login-setup.desktop >/dev/null <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=First Login Setup
          Comment=Apply dark mode and install compatible apps
          Exec=/home/Tasfiq/.local/bin/first-login-setup.sh
          Terminal=false
          X-GNOME-Autostart-enabled=true
          DESKTOP

          sudo chown Tasfiq:Tasfiq \
            /home/Tasfiq/.config/autostart/first-login-setup.desktop

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          args: --hostname=ubuntu-rdp-${{ github.run_id }}

      - name: Show connection details
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Tailscale IP:"
          tailscale ip -4

          echo "RDP port: 3389"
          echo "Username: Tasfiq"
          echo "Password: your RDP_PASSWORD GitHub secret"
          echo "Connect using the Tailscale IP, not a public IP."

      - name: Keep runner alive
        shell: bash
        run: |
          set -Eeuo pipefail

          while true; do
            if ! sudo systemctl is-active --quiet xrdp; then
              sudo systemctl restart xrdp || true
            fi
            sleep 60
          done
