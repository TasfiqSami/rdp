name: Ubuntu

on:
  workflow_dispatch:

env:
  RDP_USER: tasfiq

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install desktop and xrdp
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xfce4 xfce4-session xfconf xfce4-settings xfce4-terminal thunar \
            dbus dbus-x11 x11-xserver-utils \
            greybird-gtk-theme gnome-themes-extra \
            xrdp xorgxrdp curl ca-certificates wget gpg
          sudo adduser xrdp ssl-cert

      - name: Create user
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if [ -z "$RDP_PASSWORD" ]; then
            echo "RDP_PASSWORD secret is missing"; exit 1
          fi
          H="/home/$RDP_USER"

          if id "$RDP_USER" >/dev/null 2>&1; then
            echo "User $RDP_USER already exists, skipping useradd"
          else
            sudo useradd -m -s /bin/bash -G sudo "$RDP_USER"
          fi
          echo "$RDP_USER:$RDP_PASSWORD" | sudo chpasswd
          echo "$RDP_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee "/etc/sudoers.d/$RDP_USER" >/dev/null
          sudo chmod 440 "/etc/sudoers.d/$RDP_USER"

          # Create every folder before writing into it
          sudo mkdir -p "$H/.local/bin" "$H/.config/autostart" "$H/.config/xfce4" "$H/Desktop"
          sudo mkdir -p /etc/polkit-1/rules.d

          # Copy XFCE's default config (includes the failsafe session name)
          # into the user's home so it never depends on XDG_CONFIG_DIRS
          sudo cp -r /etc/xdg/xfce4/xfconf "$H/.config/xfce4/"

          # Stop the colour-profile auth popup in xrdp sessions
          sudo tee /etc/polkit-1/rules.d/45-allow-colord.rules >/dev/null <<'EOF'
          polkit.addRule(function(action, subject) {
            if (action.id.indexOf("org.freedesktop.color-manager.") == 0) {
              return polkit.Result.YES;
            }
          });
          EOF

      - name: Configure xrdp to start XFCE correctly
        run: |
          H="/home/$RDP_USER"

          sudo touch /tmp/startwm.log
          sudo chmod 666 /tmp/startwm.log

          # Replace xrdp's session startup script with a clean XFCE launcher
          sudo tee /etc/xrdp/startwm.sh >/dev/null <<'EOF'
          #!/bin/bash
          exec >>/tmp/startwm.log 2>&1
          echo "=== session start $(date) user=$(id -un) HOME=$HOME ==="
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          export XDG_SESSION_DESKTOP=xfce
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_TYPE=x11
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_CONFIG_DIRS=/etc/xdg
          export XDG_DATA_DIRS=/usr/share:/usr/local/share
          [ -r /etc/profile ] && . /etc/profile
          echo "XDG_CONFIG_DIRS=$XDG_CONFIG_DIRS XDG_CONFIG_HOME=$XDG_CONFIG_HOME"
          exec dbus-launch --exit-with-session startxfce4
          EOF
          sudo chmod 0755 /etc/xrdp/startwm.sh

          # Remove any user-level override so startwm.sh is used
          sudo rm -f "$H/.xsession" "$H/.xsessionrc"

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Configure first-login setup
        run: |
          H="/home/$RDP_USER"

          # Dark mode (runs inside the user's session)
          sudo tee "$H/.local/bin/dark-mode.sh" >/dev/null <<'EOF'
          #!/bin/bash
          sleep 8
          xfconf-query -c xsettings -p /Net/ThemeName --create -t string -s "Greybird-dark"
          xfconf-query -c xfwm4 -p /general/theme --create -t string -s "Greybird-dark"
          gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark' 2>/dev/null || true
          EOF

          # App installer (runs once after first sign-in)
          sudo tee "$H/.local/bin/install-everything.sh" >/dev/null <<'EOF'
          #!/bin/bash
          MARK="$HOME/.install-everything.done"
          LOG="$HOME/Desktop/Install-Everything.log"
          [ -f "$MARK" ] && exit 0
          touch "$MARK"
          export DEBIAN_FRONTEND=noninteractive
          {
            echo "== Install started: $(date) =="

            echo "--- adding Brave repository"
            sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg \
              https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg \
              || echo "FAILED: brave keyring"
            echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" \
              | sudo tee /etc/apt/sources.list.d/brave-browser-release.list >/dev/null

            sudo apt-get update

            echo "--- apt: brave-browser"
            sudo apt-get install -y brave-browser || echo "FAILED: brave-browser"

            for pkg in git vlc htop btop neofetch build-essential python3-pip nodejs npm; do
              echo "--- apt: $pkg"
              sudo apt-get install -y "$pkg" || echo "FAILED: $pkg"
            done

            echo "--- snap: code"
            sudo snap install code --classic || echo "FAILED: code"

            echo "== Install finished: $(date) =="
          } >> "$LOG" 2>&1
          EOF

          sudo chmod 0755 "$H/.local/bin/dark-mode.sh" "$H/.local/bin/install-everything.sh"

          sudo tee "$H/.config/autostart/dark-mode.desktop" >/dev/null <<EOF
          [Desktop Entry]
          Type=Application
          Name=Dark Mode
          Exec=$H/.local/bin/dark-mode.sh
          Terminal=false
          X-GNOME-Autostart-enabled=true
          EOF

          sudo tee "$H/.config/autostart/install-everything.desktop" >/dev/null <<EOF
          [Desktop Entry]
          Type=Application
          Name=Install Everything
          Exec=$H/.local/bin/install-everything.sh
          Terminal=false
          X-GNOME-Autostart-enabled=true
          EOF

          # Give the user ownership of everything we created
          sudo chown -R "$RDP_USER:$RDP_USER" "$H"

      - name: Diagnostics (checks XFCE config is found)
        continue-on-error: true
        run: |
          echo "--- user's xfce4-session config:"
          ls -la "/home/$RDP_USER/.config/xfce4/xfconf/xfce-perchannel-xml/" || true
          echo "--- xfconfd binary:"
          find /usr -name xfconfd 2>/dev/null || true
          echo "--- FailsafeSessionName as $RDP_USER (should print Failsafe):"
          sudo -u "$RDP_USER" env HOME="/home/$RDP_USER" XDG_CONFIG_DIRS=/etc/xdg \
            dbus-launch --exit-with-session \
            xfconf-query -c xfce4-session -p /general/FailsafeSessionName || true
          echo "--- xrdp status:"
          systemctl is-active xrdp || true

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if [ -z "$TS_AUTHKEY" ]; then
            echo "TAILSCALE_AUTH_KEY secret is missing"; exit 1
          fi
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl enable --now tailscaled
          sleep 3
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="gh-rdp-ubuntu" --accept-dns=false
          echo "=============================================="
          echo "Tailscale IP: $(tailscale ip -4)"
          echo "Connect with Remote Desktop to that IP"
          echo "Username: $RDP_USER"
          echo "=============================================="

      - name: Keep session alive (streams RDP logs here)
        run: |
          echo "Tailscale IP: $(tailscale ip -4)"
          echo "Logs below appear when you connect via RDP"
          sudo touch /var/log/xrdp-sesman.log /var/log/xrdp.log "/home/$RDP_USER/.xsession-errors"
          sudo chown "$RDP_USER:$RDP_USER" "/home/$RDP_USER/.xsession-errors"
          sudo tail -n 0 -F /var/log/xrdp-sesman.log /var/log/xrdp.log \
            /tmp/startwm.log "/home/$RDP_USER/.xsession-errors" 2>&1 &
          END=$((SECONDS + 21000))   # about 5h50m, under the 6h limit
          while [ $SECONDS -lt $END ]; do
            sleep 60
          done
