name: Ubuntu

on:
  workflow_dispatch:

env:
  RDP_USER: tasfiq

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install desktop and xrdp
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xfce4 xfce4-session xfconf xfce4-settings xfce4-terminal thunar \
            xfce4-screenshooter \
            dbus dbus-x11 x11-xserver-utils \
            greybird-gtk-theme gnome-themes-extra \
            xrdp xorgxrdp curl ca-certificates wget gpg
          sudo adduser xrdp ssl-cert

      - name: Install apps (before login, so the desktop stays fast)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Brave
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg \
            https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg || echo "FAILED: brave keyring"
          echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" \
            | sudo tee /etc/apt/sources.list.d/brave-browser-release.list >/dev/null

          # VS Code
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/microsoft.gpg || echo "FAILED: microsoft key"
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/code stable main" \
            | sudo tee /etc/apt/sources.list.d/vscode.list >/dev/null

          sudo apt-get update
          for pkg in brave-browser code git vlc htop btop build-essential python3-pip nodejs npm; do
            echo "--- apt: $pkg"
            sudo apt-get install -y "$pkg" || echo "FAILED: $pkg"
          done

      - name: Create user
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if [ -z "$RDP_PASSWORD" ]; then
            echo "RDP_PASSWORD secret is missing"; exit 1
          fi
          H="/home/$RDP_USER"

          if id "$RDP_USER" >/dev/null 2>&1; then
            echo "User $RDP_USER already exists, skipping useradd"
          else
            sudo useradd -m -s /bin/bash -G sudo "$RDP_USER"
          fi
          echo "$RDP_USER:$RDP_PASSWORD" | sudo chpasswd
          echo "$RDP_USER ALL=(ALL) NOPASSWD:ALL" | sudo tee "/etc/sudoers.d/$RDP_USER" >/dev/null
          sudo chmod 440 "/etc/sudoers.d/$RDP_USER"

          # Create every folder before writing into it
          sudo mkdir -p "$H/.local/bin" "$H/.config/autostart" "$H/.config/xfce4" "$H/Desktop"
          sudo mkdir -p /etc/polkit-1/rules.d

          # Copy XFCE's default config into the user's home
          sudo cp -r /etc/xdg/xfce4/xfconf "$H/.config/xfce4/"

          # Stop the colour-profile auth popup in xrdp sessions
          sudo tee /etc/polkit-1/rules.d/45-allow-colord.rules >/dev/null <<'EOF'
          polkit.addRule(function(action, subject) {
            if (action.id.indexOf("org.freedesktop.color-manager.") == 0) {
              return polkit.Result.YES;
            }
          });
          EOF

      - name: Configure xrdp to start XFCE correctly
        run: |
          H="/home/$RDP_USER"

          sudo tee /etc/xrdp/startwm.sh >/dev/null <<'EOF'
          #!/bin/bash
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          export XDG_SESSION_DESKTOP=xfce
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_TYPE=x11
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_CONFIG_DIRS=/etc/xdg
          export XDG_DATA_DIRS=/usr/share:/usr/local/share
          [ -r /etc/profile ] && . /etc/profile
          exec dbus-launch --exit-with-session startxfce4
          EOF
          sudo chmod 0755 /etc/xrdp/startwm.sh

          sudo rm -f "$H/.xsession" "$H/.xsessionrc"

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Configure first-login look and speed
        run: |
          H="/home/$RDP_USER"

          # Dark mode + compositing off (much faster with no GPU)
          sudo tee "$H/.local/bin/dark-mode.sh" >/dev/null <<'EOF'
          #!/bin/bash
          sleep 8
          xfconf-query -c xsettings -p /Net/ThemeName --create -t string -s "Greybird-dark"
          xfconf-query -c xfwm4 -p /general/theme --create -t string -s "Greybird-dark"
          xfconf-query -c xfwm4 -p /general/use_compositing --create -t bool -s false
          gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark' 2>/dev/null || true
          EOF
          sudo chmod 0755 "$H/.local/bin/dark-mode.sh"

          sudo tee "$H/.config/autostart/dark-mode.desktop" >/dev/null <<EOF
          [Desktop Entry]
          Type=Application
          Name=Dark Mode
          Exec=$H/.local/bin/dark-mode.sh
          Terminal=false
          X-GNOME-Autostart-enabled=true
          EOF

          sudo chown -R "$RDP_USER:$RDP_USER" "$H"

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if [ -z "$TS_AUTHKEY" ]; then
            echo "TAILSCALE_AUTH_KEY secret is missing"; exit 1
          fi
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl enable --now tailscaled
          sleep 3
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="gh-rdp-ubuntu" --accept-dns=false
          echo "=============================================="
          echo "READY. Tailscale IP: $(tailscale ip -4)"
          echo "Connect with Remote Desktop to that IP"
          echo "Username: $RDP_USER"
          echo "=============================================="

      - name: Keep session alive
        run: |
          echo "Tailscale IP: $(tailscale ip -4)"
          END=$((SECONDS + 21000))   # about 5h50m, under the 6h limit
          while [ $SECONDS -lt $END ]; do
            sleep 60
          done
