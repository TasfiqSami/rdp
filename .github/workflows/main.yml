
name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1 -Force

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue

          Get-NetFirewallRule -DisplayName 'RDP-Tailscale' `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName 'RDP-Tailscale' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10

      - name: Create Tasfiq account
        shell: pwsh
        env:
          CUSTOM_RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $username = 'Tasfiq'
          $password = $env:CUSTOM_RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
            throw 'RDP_PASSWORD secret is missing or empty.'
          }

          if ($password.Length -lt 12) {
            throw 'Password must be at least 12 characters.'
          }

          if ($password -match '^\s|\s$') {
            throw 'Password cannot start or end with whitespace.'
          }

          if ($password -match '(?i)tasfiq|sami') {
            throw 'Choose a password that does not contain Tasfiq or sami.'
          }

          $hasUpper = $password -cmatch '[A-Z]'
          $hasLower = $password -cmatch '[a-z]'
          $hasDigit = $password -match '\d'
          $hasSymbol = $password -match '[^a-zA-Z0-9]'

          if (@($hasUpper, $hasLower, $hasDigit, $hasSymbol |
               Where-Object { $_ }).Count -lt 3) {
            throw 'Use at least three character types: uppercase, lowercase, numbers, and symbols.'
          }

          $securePassword = ConvertTo-SecureString `
            -String $password -AsPlainText -Force

          $existing = Get-LocalUser -Name $username `
            -ErrorAction SilentlyContinue

          try {
            if ($existing) {
              Set-LocalUser -Name $username -Password $securePassword
              Enable-LocalUser -Name $username
            } else {
              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -AccountNeverExpires | Out-Null
            }
          } catch {
            throw "Windows rejected the password or account operation. $($_.Exception.Message)"
          }

          Add-LocalGroupMember -Group 'Administrators' `
            -Member $username -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group 'Remote Desktop Users' `
            -Member $username -ErrorAction SilentlyContinue

          "RDP_USERNAME=$username" >> $env:GITHUB_ENV

          Write-Host 'Tasfiq account configured successfully.'

      - name: Enable dark mode for Tasfiq
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $username = 'Tasfiq'
          $user = Get-LocalUser -Name $username
          $sid = $user.SID.Value

          $profile = Get-CimInstance Win32_UserProfile |
            Where-Object { $_.SID -eq $sid }

          if (-not $profile -or -not $profile.LocalPath) {
            throw 'Tasfiq user profile was not created.'
          }

          $hiveFile = Join-Path $profile.LocalPath 'NTUSER.DAT'
          $hiveName = "TasfiqTempHive_$env:GITHUB_RUN_ID"
          $loadedByUs = $false

          if (Test-Path "Registry::HKEY_USERS\$sid") {
            $registryRoot = "Registry::HKEY_USERS\$sid"
          } else {
            if (-not (Test-Path $hiveFile)) {
              throw "User registry hive not found: $hiveFile"
            }

            & reg.exe load "HKU\$hiveName" $hiveFile

            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to load Tasfiq user registry hive.'
            }

            $loadedByUs = $true
            $registryRoot = "Registry::HKEY_USERS\$hiveName"
          }

          try {
            $personalize = Join-Path $registryRoot `
              'Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'

            New-Item -Path $personalize -Force | Out-Null

            New-ItemProperty -Path $personalize `
              -Name AppsUseLightTheme -PropertyType DWord `
              -Value 0 -Force | Out-Null

            New-ItemProperty -Path $personalize `
              -Name SystemUsesLightTheme -PropertyType DWord `
              -Value 0 -Force | Out-Null

            New-ItemProperty -Path $personalize `
              -Name EnableTransparency -PropertyType DWord `
              -Value 0 -Force | Out-Null

            Write-Host 'Dark mode configured for Tasfiq.'
          }
          finally {
            if ($loadedByUs) {
              [gc]::Collect()
              [gc]::WaitForPendingFinalizers()

              & reg.exe unload "HKU\$hiveName"

              if ($LASTEXITCODE -ne 0) {
                Write-Warning 'Could not unload the temporary registry hive.'
              }
            }
          }

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi'
          $file = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $file

          try {
            $process = Start-Process msiexec.exe `
              -ArgumentList '/i', "`"$file`"", '/quiet', '/norestart' `
              -Wait -PassThru

            if ($process.ExitCode -notin @(0, 3010)) {
              throw "Tailscale installation failed: $($process.ExitCode)"
            }
          }
          finally {
            Remove-Item $file -Force -ErrorAction SilentlyContinue
          }

      - name: Establish Tailscale connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not $env:TAILSCALE_AUTH_KEY) {
            throw 'TAILSCALE_AUTH_KEY secret is missing.'
          }

          & $tsExe up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw 'Tailscale connection failed.'
          }

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {
            $result = & $tsExe ip -4
            $tsIP = ($result | Select-Object -First 1).Trim()

            if ($tsIP -match '^100\.') {
              break
            }

            $tsIP = $null
            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            throw 'No Tailscale IPv4 address assigned.'
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $service = Get-Service TermService

          if ($service.Status -ne 'Running') {
            Start-Service TermService
          }

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            throw 'RDP is not listening on port 3389.'
          }

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host 'RDP listener detected.'

      - name: Maintain connection
        shell: pwsh
        run: |
          Write-Host '=== RDP ACCESS ==='
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host 'Password: use the value stored in your RDP_PASSWORD secret.'
          Write-Host '=================='

          while ($true) {
            Write-Host "[$(Get-Date)] Workflow active."
            Start-Sleep -Seconds 300
          }
