
name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure RDP and firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1 -Force

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue

          Get-NetFirewallRule -DisplayName 'RDP-Tailscale' `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName 'RDP-Tailscale' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10 | Out-Null

          Write-Host 'RDP configured.'

      - name: Create Tasfiq account
        shell: pwsh
        env:
          CUSTOM_RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $username = 'Tasfiq'
          $password = $env:CUSTOM_RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
            throw 'RDP_PASSWORD secret is missing or empty.'
          }

          if ($password.Length -lt 12) {
            throw 'Password must be at least 12 characters.'
          }

          if ($password -match '^\s|\s$') {
            throw 'Password cannot start or end with whitespace.'
          }

          if ($password -match '(?i)tasfiq|sami') {
            throw 'Choose a password that does not contain Tasfiq or sami.'
          }

          $types = @(
            ($password -cmatch '[A-Z]')
            ($password -cmatch '[a-z]')
            ($password -match '\d')
            ($password -match '[^a-zA-Z0-9]')
          )

          if (@($types | Where-Object { $_ }).Count -lt 3) {
            throw 'Use at least three character types: uppercase, lowercase, numbers, and symbols.'
          }

          $securePassword = ConvertTo-SecureString `
            -String $password -AsPlainText -Force

          $existing = Get-LocalUser -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {
            Set-LocalUser -Name $username -Password $securePassword
            Enable-LocalUser -Name $username
          } else {
            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -AccountNeverExpires | Out-Null
          }

          $userSid = (Get-LocalUser -Name $username).SID.Value

          foreach ($group in @('Administrators', 'Remote Desktop Users')) {
            $members = Get-LocalGroupMember -Group $group `
              -ErrorAction SilentlyContinue

            if (-not ($members | Where-Object { $_.SID.Value -eq $userSid })) {
              Add-LocalGroupMember -Group $group -Member $username
            }
          }

          "RDP_USERNAME=$username" >> $env:GITHUB_ENV
          Write-Host 'Tasfiq account configured.'

      - name: Prepare post-login setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $dir = 'C:\RDPSetup'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null

          # Dark mode runs in Tasfiq's interactive session.
          $darkScript = Join-Path $dir 'Set-DarkMode.ps1'

          @'
          Start-Sleep -Seconds 25

          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Path $key -Force | Out-Null

          Set-ItemProperty -Path $key -Name AppsUseLightTheme -Value 0 -Type DWord
          Set-ItemProperty -Path $key -Name SystemUsesLightTheme -Value 0 -Type DWord
          Set-ItemProperty -Path $key -Name EnableTransparency -Value 0 -Type DWord

          Write-Host 'Dark mode enabled.'
          '@ | Set-Content -Path $darkScript -Encoding UTF8

          $principal = New-ScheduledTaskPrincipal `
            -UserId 'Tasfiq' `
            -LogonType Interactive `
            -RunLevel Limited

          $trigger = New-ScheduledTaskTrigger -AtLogOn -User 'Tasfiq'

          $darkAction = New-ScheduledTaskAction `
            -Execute 'powershell.exe' `
            -Argument "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$darkScript`""

          Register-ScheduledTask `
            -TaskName 'Tasfiq-DarkMode' `
            -Action $darkAction `
            -Trigger $trigger `
            -Principal $principal `
            -Force | Out-Null

          # Create the app installer. It only runs after interactive login.
          $installer = Join-Path $dir 'Install-Apps.ps1'

          @'
          $ErrorActionPreference = 'Continue'

          Start-Sleep -Seconds 30

          $desktop = [Environment]::GetFolderPath('Desktop')
          $log = Join-Path $desktop 'Install-Everything.log'
          Start-Transcript -Path $log -Append

          Write-Host '========================================' -ForegroundColor Cyan
          Write-Host ' TASFIQ RDP APPLICATION INSTALLER' -ForegroundColor Cyan
          Write-Host '========================================' -ForegroundColor Cyan

          $env:Path += ";$env:LOCALAPPDATA\Microsoft\WindowsApps;$env:ProgramFiles\nodejs"

          $winget = Get-Command winget.exe -ErrorAction SilentlyContinue

          if ($winget) {
            $apps = @(
              'Brave.Brave'
              'Microsoft.VisualStudioCode'
              'JavadMotallebi.NeatDownloadManager'
              'Discord.Discord'
              'Git.Git'
              'GitHub.cli'
              'OpenJS.NodeJS.LTS'
              'Google.Antigravity'
            )

            foreach ($app in $apps) {
              Write-Host "`nInstalling $app ..." -ForegroundColor Yellow

              & winget install --exact --id $app `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements `
                --disable-interactivity

              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Failed or skipped: $app (exit $LASTEXITCODE)"
              } else {
                Write-Host "$app installed." -ForegroundColor Green
              }
            }

            Write-Host "`nTrying ChatGPT desktop app..." -ForegroundColor Yellow

            & winget install --id 9PLM9XGG6VKS `
              --source msstore `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

            if ($LASTEXITCODE -ne 0) {
              Write-Warning 'ChatGPT desktop installation failed. Use https://chatgpt.com if needed.'
            }
          } else {
            Write-Warning 'WinGet is unavailable for this user. Desktop app installations were skipped.'
          }

          # Install developer CLIs after Node.js.
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = "$machinePath;$userPath;$env:LOCALAPPDATA\Microsoft\WindowsApps;$env:ProgramFiles\nodejs"

          if (Get-Command npm.cmd -ErrorAction SilentlyContinue) {
            foreach ($package in @(
              '@openai/codex'
              '@anthropic-ai/claude-code'
              'vercel'
              '@github/copilot'
            )) {
              Write-Host "`nInstalling CLI $package ..." -ForegroundColor Yellow
              & npm.cmd install --global $package

              if ($LASTEXITCODE -ne 0) {
                Write-Warning "CLI installation failed: $package"
              }
            }
          } else {
            Write-Warning 'npm is unavailable. Reopen PowerShell and retry the CLI installations.'
          }

          # Install the official Antigravity CLI as well.
          Write-Host "`nInstalling Google Antigravity CLI..." -ForegroundColor Yellow

          try {
            $cliInstaller = Join-Path $env:TEMP 'install-antigravity-cli.ps1'
            Invoke-WebRequest `
              -Uri 'https://antigravity.google/cli/install.ps1' `
              -OutFile $cliInstaller

            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $cliInstaller

            if ($LASTEXITCODE -ne 0) {
              Write-Warning 'Antigravity CLI installer returned a nonzero exit code.'
            }
          } catch {
            Write-Warning "Antigravity CLI installation failed: $($_.Exception.Message)"
          }

          Write-Host "`nInstallation finished. Check the desktop log for details." -ForegroundColor Green
          Stop-Transcript
          '@ | Set-Content -Path $installer -Encoding UTF8

          $installAction = New-ScheduledTaskAction `
            -Execute 'powershell.exe' `
            -Argument "-NoProfile -ExecutionPolicy Bypass -WindowStyle Normal -File `"$installer`""

          Register-ScheduledTask `
            -TaskName 'Tasfiq-Install-Apps' `
            -Action $installAction `
            -Trigger $trigger `
            -Principal $principal `
            -Settings (New-ScheduledTaskSettingsSet `
              -ExecutionTimeLimit (New-TimeSpan -Hours 3) `
              -StartWhenAvailable) `
            -Force | Out-Null

          Write-Host 'Dark mode and app installation are scheduled for Tasfiq login.'

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi'
          $file = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $file

          $process = Start-Process msiexec.exe `
            -ArgumentList '/i', "`"$file`"", '/quiet', '/norestart' `
            -Wait -PassThru

          Remove-Item $file -Force -ErrorAction SilentlyContinue

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed: $($process.ExitCode)"
          }

      - name: Establish Tailscale connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not $env:TAILSCALE_AUTH_KEY) {
            throw 'TAILSCALE_AUTH_KEY secret is missing.'
          }

          & $tsExe up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw 'Tailscale connection failed.'
          }

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {
            $result = & $tsExe ip -4
            $tsIP = ($result | Select-Object -First 1).Trim()

            if ($tsIP -match '^100\.') {
              break
            }

            $tsIP = $null
            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            throw 'No Tailscale IPv4 address assigned.'
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $service = Get-Service TermService

          if ($service.Status -ne 'Running') {
            Start-Service TermService
          }

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            throw 'RDP is not listening on port 3389.'
          }

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host 'RDP listener detected.'

      - name: Maintain connection
        shell: pwsh
        run: |
          Write-Host '=== RDP ACCESS ==='
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host 'Password: use the value stored in your RDP_PASSWORD secret.'
          Write-Host '=================='

          while ($true) {
            Write-Host "[$(Get-Date)] Workflow active."
            Start-Sleep -Seconds 300
          }
