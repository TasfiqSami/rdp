
name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure RDP
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1 -Force

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' `
            -ErrorAction SilentlyContinue

          Get-NetFirewallRule -DisplayName 'RDP-Tailscale' `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName 'RDP-Tailscale' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10

      - name: Create Tasfiq account
        shell: pwsh
        env:
          CUSTOM_RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $username = 'Tasfiq'
          $password = $env:CUSTOM_RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
            throw 'RDP_PASSWORD repository secret is missing.'
          }

          if ($password.Length -lt 12) {
            throw 'Choose a password with at least 12 characters.'
          }

          $securePassword = ConvertTo-SecureString `
            $password -AsPlainText -Force

          $existing = Get-LocalUser -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {
            Set-LocalUser -Name $username -Password $securePassword
          } else {
            New-LocalUser -Name $username `
              -Password $securePassword `
              -AccountNeverExpires | Out-Null
          }

          Add-LocalGroupMember -Group 'Administrators' `
            -Member $username -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group 'Remote Desktop Users' `
            -Member $username -ErrorAction SilentlyContinue

          "RDP_USERNAME=$username" >> $env:GITHUB_ENV
          Write-Host 'Tasfiq account configured.'

      - name: Install applications and developer CLIs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $winget = Get-Command winget.exe `
            -ErrorAction SilentlyContinue

          if (-not $winget) {
            Write-Warning 'WinGet unavailable. Skipping desktop app installations.'
          } else {
            $apps = @(
              'Brave.Brave'
              'Microsoft.VisualStudioCode'
              'JavadMotallebi.NeatDownloadManager'
              'Discord.Discord'
              'Git.Git'
              'GitHub.cli'
              'OpenJS.NodeJS.LTS'
            )

            foreach ($app in $apps) {
              Write-Host "Installing $app"

              winget install --exact --id $app `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements `
                --disable-interactivity

              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Could not install $app"
              }
            }

            winget install --id 9PLM9XGG6VKS `
              --source msstore `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

            if ($LASTEXITCODE -ne 0) {
              Write-Warning 'ChatGPT desktop app installation failed.'
            }
          }

          $nodeDir = 'C:\Program Files\nodejs'

          if (Test-Path $nodeDir) {
            $env:Path = "$nodeDir;$env:Path"
          }

          $machinePath = [Environment]::GetEnvironmentVariable(
            'Path', 'Machine'
          )
          $userPath = [Environment]::GetEnvironmentVariable(
            'Path', 'User'
          )
          $env:Path = "$machinePath;$userPath;$env:Path"

          if (Get-Command npm.cmd -ErrorAction SilentlyContinue) {
            $packages = @(
              '@openai/codex'
              '@anthropic-ai/claude-code'
              'vercel'
              '@github/copilot'
            )

            foreach ($package in $packages) {
              npm.cmd install --global $package

              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Could not install CLI $package"
              }
            }
          } else {
            Write-Warning 'npm unavailable. Skipping developer CLIs.'
          }

          Write-Host 'Installation step finished.'

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi'
          $file = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $file

          $process = Start-Process msiexec.exe `
            -ArgumentList '/i', "`"$file`"", '/quiet', '/norestart' `
            -Wait -PassThru

          Remove-Item $file -Force

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed: $($process.ExitCode)"
          }

      - name: Establish Tailscale connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not $env:TAILSCALE_AUTH_KEY) {
            throw 'TAILSCALE_AUTH_KEY secret is missing.'
          }

          & $tsExe up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw 'Tailscale connection failed.'
          }

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {
            $result = & $tsExe ip -4
            $tsIP = ($result | Select-Object -First 1).Trim()

            if ($tsIP -match '^100\.') {
              break
            }

            $tsIP = $null
            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            throw 'No Tailscale IPv4 address assigned.'
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP service
        shell: pwsh
        run: |
          $service = Get-Service TermService

          if ($service.Status -ne 'Running') {
            Start-Service TermService
          }

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            throw 'RDP is not listening on port 3389.'
          }

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host 'RDP listener detected.'

      - name: Maintain connection
        shell: pwsh
        run: |
          Write-Host '=== RDP ACCESS ==='
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host 'Password: the value saved in your RDP_PASSWORD secret'
          Write-Host '=================='

          while ($true) {
            Write-Host "[$(Get-Date)] Workflow active."
            Start-Sleep -Seconds 300
          }
